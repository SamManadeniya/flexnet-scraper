[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  PYTHON_VERSION = "3.11"
  SECRETS_SCAN_OMIT_PATHS = "README.md"

[functions]
  included_files = [
    "config.py",
    "database.py",
    "auth.py",
    "notifier.py",
    "api.py",
    "scraper/**"
  ]

# Route all API calls to the serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200

# Fallback to Single Page App
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
