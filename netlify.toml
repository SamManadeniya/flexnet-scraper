[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  PYTHON_VERSION = "3.11"
  SECRETS_SCAN_OMIT_PATHS = "README.md"

[functions]
  node_bundler = "esbuild"


# Route all API calls to the serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server/api/:splat"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/server/health"
  status = 200

# Fallback to Single Page App
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
