[build]
  command = "echo 'Build successful'"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_PATHS = "README.md"
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_KEY,JWT_SECRET_KEY"

[functions]
  node_bundler = "esbuild"

# Route all API calls to the serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/server"
  status = 200
  force = true

# Fallback to Single Page App
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
