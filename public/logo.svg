<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c15"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Icon Emblem (Hex 4WD Bullbar) -->
  <g transform="translate(4, 2)">
    <polygon points="30,2 54,15 54,45 30,58 6,45 6,15" fill="url(#logoBgGrad)" stroke="url(#cyanGrad)" stroke-width="2.2" />
    <path d="M20 16 L40 16 L44 24 L16 24 Z" fill="url(#cyanGrad)" opacity="0.9" filter="url(#glowEffect)"/>
    <circle cx="19" cy="29" r="3.2" fill="#ffffff" filter="url(#glowEffect)"/>
    <circle cx="41" cy="29" r="3.2" fill="#ffffff" filter="url(#glowEffect)"/>
    <rect x="23" y="27.5" width="14" height="3" rx="1.5" fill="url(#goldGrad)"/>
    <path d="M15 34 L45 34 L41 41 L19 41 Z" fill="none" stroke="url(#cyanGrad)" stroke-width="2" stroke-linejoin="round"/>
    <line x1="24" y1="35" x2="24" y2="40" stroke="url(#cyanGrad)" stroke-width="1.6"/>
    <line x1="30" y1="35" x2="30" y2="40" stroke="url(#goldGrad)" stroke-width="1.8"/>
    <line x1="36" y1="35" x2="36" y2="40" stroke="url(#cyanGrad)" stroke-width="1.6"/>
    <polygon points="30,45 34,49 30,53 26,49" fill="url(#goldGrad)"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(68, 14)">
    <!-- Primary Title -->
    <text x="0" y="20" font-family="'Outfit', 'Inter', sans-serif" font-size="21" font-weight="900" letter-spacing="1.2" fill="#ffffff">
      FLEX<tspan fill="url(#cyanGrad)">NET</tspan>
      <tspan fill="url(#goldGrad)" font-size="14" font-weight="700" letter-spacing="2"> 4WD</tspan>
    </text>
    <!-- Subtitle / Japanese Tag -->
    <text x="0" y="36" font-family="'Inter', sans-serif" font-size="10" font-weight="600" letter-spacing="1.8" fill="#94a3b8">
      JAPAN VEHICLE HUNTER <tspan fill="url(#cyanGrad)">// フレックス</tspan>
    </text>
  </g>
</svg>
