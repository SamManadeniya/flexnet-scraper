<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c15"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Shield Rounded Hexagon -->
  <polygon points="32,2 58,16 58,48 32,62 6,48 6,16" fill="url(#cyberBg)" stroke="url(#neonCyan)" stroke-width="2.5" />

  <!-- Inner Cyber Grid Accent Lines -->
  <path d="M12 20 L52 20 M12 44 L52 44" stroke="rgba(6, 182, 212, 0.25)" stroke-width="1" />
  <line x1="32" y1="2" x2="32" y2="62" stroke="rgba(245, 158, 11, 0.2)" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- Stylized 4WD Overland Land Cruiser Grille / Bullbar Emblem -->
  <!-- Top Roof / Snorkel Silhouette -->
  <path d="M22 17 L42 17 L46 25 L18 25 Z" fill="url(#neonCyan)" opacity="0.85" filter="url(#neonGlow)"/>

  <!-- Aggressive Headlights -->
  <circle cx="21" cy="30" r="3.5" fill="#ffffff" filter="url(#neonGlow)"/>
  <circle cx="43" cy="30" r="3.5" fill="#ffffff" filter="url(#neonGlow)"/>
  <rect x="25" y="28.5" width="14" height="3" rx="1.5" fill="url(#goldAccent)"/>

  <!-- Heavy Duty Twin-Bar Lower Skid / Grille -->
  <path d="M16 35 L48 35 L44 43 L20 43 Z" fill="none" stroke="url(#neonCyan)" stroke-width="2.2" stroke-linejoin="round"/>
  <line x1="26" y1="36" x2="26" y2="42" stroke="url(#neonCyan)" stroke-width="1.8"/>
  <line x1="32" y1="36" x2="32" y2="42" stroke="url(#goldAccent)" stroke-width="2"/>
  <line x1="38" y1="36" x2="38" y2="42" stroke="url(#neonCyan)" stroke-width="1.8"/>

  <!-- Under-guard 4WD Badge Diamond -->
  <polygon points="32,47 36,52 32,57 28,52" fill="url(#goldAccent)" filter="url(#neonGlow)"/>
</svg>
